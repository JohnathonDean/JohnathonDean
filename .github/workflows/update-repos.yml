name: Update REPO_LIST

on:
  push:
    branches: [ 'main' ]
  schedule:
    - cron: '0 0 * * 0' # weekly on Sunday UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update REPO_LIST.md
        uses: actions/github-script@v6
        with:
          script: |
            const username = 'JohnathonDean';
            const per_page = 100;
            function cleanText(s) {
              return String(s ?? '').replace(/\r?\n+/g, ' ').trim() || '-';
            }
            // use the provided `github` client
            const repos = await github.paginate(github.rest.repos.listForUser, { username, per_page });
            repos.sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));
            let md = `# Repository List for ${username}\n\nGenerated at ${new Date().toISOString()}\n\n`;
            for (const r of repos) {
              md += `- [${cleanText(r.name)}](${r.html_url}) - Description: ${cleanText(r.description)} - Language: ${cleanText(r.language)} - Stars: ${r.stargazers_count} - Updated: ${cleanText(r.updated_at)}\n`;
            }
            const path = 'REPO_LIST.md';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const content = Buffer.from(md).toString('base64');
            let sha;
            try {
              const existing = await github.rest.repos.getContent({ owner, repo, path });
              sha = existing.data.sha;
            } catch (e) {
              if (e.status === 404) sha = undefined;
              else throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, message: 'chore: update REPO_LIST.md (automated)', content, sha,
              committer: { name: 'github-actions[bot]', email: '41898282+github-actions[bot]@users.noreply.github.com' },
              author: { name: 'github-actions[bot]', email: '41898282+github-actions[bot]@users.noreply.github.com' }
            });
